# Construye la imagen de Odoo 19 CE y la publica en GHCR en cada push a 19.0
# (etiquetas 19.0 y 19.0-<sha>) o a mano desde Actions con una etiqueta propia.
#
# OJO: compila solo lo que está en git. Los módulos OPL-1 que no se suben
# (base_accounting_kit, om_account_*, accounting_pdf_reports...) NO entran en
# esta imagen: no desplegarla en un cliente que los tenga instalados.
name: Docker image

on:
  push:
    branches: ['19.0']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta extra de la imagen (p. ej. siteco-odoo-v1.2)'
        required: false

env:
  IMAGE: ghcr.io/juanca2918/odoo19-ce

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Etiquetas de la imagen
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tags="$IMAGE:19.0,$IMAGE:19.0-${GITHUB_SHA::7}"
          [ -n "$INPUT_TAG" ] && tags="$tags,$IMAGE:$INPUT_TAG"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (sin publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que Odoo importa
        run: docker run --rm --entrypoint python3 "$IMAGE:19.0" -c 'import odoo; print("odoo", odoo.release.version)'

      # El paquete vive en la cuenta personal juanca2918, por eso GITHUB_TOKEN no basta:
      # hace falta un PAT con write:packages en los secretos GHCR_USERNAME / GHCR_TOKEN.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: for t in ${TAGS//,/ }; do docker push "$t"; done
