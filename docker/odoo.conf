[options]
; Configuración de PRODUCCIÓN horneada en la imagen — SIN secretos.
; Odoo 19 deja sobrescribir cualquier opción con variables ODOO_<OPCION>
; (ODOO_WORKERS, ODOO_DBFILTER, ODOO_ADMIN_PASSWD, ODOO_LIST_DB...) y la conexión
; con PGHOST/PGPORT/PGUSER/PGPASSWORD.

; /mnt/extra-addons: donde modulos-hub (siteco-soluciones) copia los módulos.
; Si está vacía o no existe, Odoo solo la omite con un aviso.
addons_path = /opt/siteco-addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0

; Detrás de proxy (Traefik de Coolify -> Odoo)
proxy_mode = True

; Gestor de bases deshabilitado; activarlo temporalmente con ODOO_LIST_DB=True
list_db = False

; Multiproceso: /websocket se atiende en gevent_port
workers = 6
max_cron_threads = 2
gevent_port = 8072
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

log_level = info
